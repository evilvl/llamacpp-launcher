<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>llama-cpp-webui</title>
<style>
  :root{
    --bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--border:#262b36;
    --text:#e6e9ef;--dim:#8b93a7;--accent:#5b9dff;--green:#3fb950;
    --red:#f85149;--yellow:#d29922;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif}
  header{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--border)}
  header h1{font-size:16px;margin:0;font-weight:600}
  .status{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:13px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--dim)}
  .dot.running{background:var(--green);box-shadow:0 0 8px var(--green)}
  .dot.stopped{background:var(--red)}
  .dot.unknown{background:var(--yellow)}
  select.lang-select{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-family:var(--mono);font-size:12px;cursor:pointer}
  main{display:grid;grid-template-columns:340px 1fr;gap:0;min-height:calc(100vh - 53px)}
  .side{border-right:1px solid var(--border);overflow:auto}
  .side .bar{padding:10px 14px;position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--border)}
  .side input{width:100%;padding:8px 10px;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px}
  .model{padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;flex-direction:column;gap:6px}
  .model:hover{background:var(--panel)}
  .model.active{background:var(--panel2);box-shadow:inset 3px 0 0 var(--accent)}
  .model .name{font-family:var(--mono);font-size:12px;word-break:break-all}
  .model .meta{display:flex;justify-content:space-between;align-items:center;font-size:12px}
  .badge{font-size:10px;padding:2px 6px;border:1px solid var(--border);border-radius:10px;color:var(--dim)}
  .badge.cfg{color:var(--green);border-color:#2a4a2a}
  .main{padding:18px 22px;overflow:auto}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:12px;color:var(--dim)}
  .field input{padding:7px 9px;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;font-family:var(--mono);font-size:13px}
  .row-actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
  button{padding:8px 14px;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;cursor:pointer;font-size:13px}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#0b1020;font-weight:600}
  button.danger{border-color:#5a2a2a;color:#ff9d99}
  button:disabled{opacity:.5;cursor:not-allowed}
  h2{font-size:14px;margin:22px 0 10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  .logs{width:100%;height:340px;background:#0b0d12;border:1px solid var(--border);border-radius:6px;padding:10px;font-family:var(--mono);font-size:12px;color:#c9d1e2;resize:vertical;white-space:pre-wrap;word-break:break-word}
  .info{font-family:var(--mono);font-size:12px;color:var(--dim);margin-bottom:8px}
  .notice{font-size:12px;color:var(--dim);margin-top:10px}
  .hidden{display:none}
</style>
</head>
<body>
<header>
  <h1>llama-cpp-webui</h1>
  <select class="lang-select" id="lang" onchange="setLang(this.value)">
    <option value="en">EN</option>
    <option value="ru">RU</option>
  </select>
  <div class="status"><span class="dot unknown" id="dot"></span>
    <span id="state">…</span>
    <span id="sub" style="color:var(--dim)"></span>
  </div>
  <div style="flex:1"></div>
  <button id="btn-restart" onclick="doAction('restart')">⟳ Restart</button>
  <button id="btn-stop" class="danger" onclick="doAction('stop')">■ Stop</button>
</header>

<main>
  <aside class="side">
    <div class="bar"><input id="search" placeholder="Search models" oninput="renderModels()"></div>
    <div id="models"></div>
  </aside>

  <section class="main">
    <div id="empty" class="notice">No models available. Place a .gguf file in the model directory.</div>
    <div id="editor" class="hidden">
      <div class="info" id="sel-path"></div>
      <div class="grid" id="form"></div>

      <div class="row-actions">
        <button id="btn-generate" class="primary" onclick="doStart()">▶ Generate &amp; Start</button>
        <button id="btn-save" onclick="saveCfg()">💾 Save config</button>
        <button id="btn-start" onclick="doAction('start')">🚀 Start</button>
        <button id="btn-logs" onclick="refreshLogs()">⇩ Logs</button>
        <button id="btn-infer" onclick="healthTest()">✓ Inference test</button>
      </div>
      <div class="info" id="result"></div>

      <h2>Service logs</h2>
      <textarea class="logs" id="logs" spellcheck="false"></textarea>
    </section>
  </main>
</body>
<script>
let MODELS=[], CURRENT=null, STATUS={};

// ---- i18n ---------------------------------------------------------------
// Extensible: add a new language by adding an I18N.<code> object. Missing
// keys fall back to English, then to the key itself.
const I18N = {
  en: {
    search: "Search models",
    empty_notice: "No models available. Place a .gguf file in the model directory.",
    no_models: "No models found",
    badge_config: "config",
    badge_none: "no config",
    l_host: "Bind address",
    l_port: "HTTP port",
    l_api_key: "API key",
    l_wait_timeout: "Health wait (s)",
    l_context_size: "Context (tokens)",
    l_parallel: "Parallel sequences",
    l_batch_size: "Batch size",
    l_ubatch_size: "Unpadded batch",
    l_fit_target: "VRAM margin (MiB)",
    l_cache_k: "KV cache type (K)",
    l_cache_v: "KV cache type (V)",
    l_flash_attn: "Flash attention",
    l_numa: "NUMA strategy",
    l_cpu_threads: "CPU threads (-t)",
    l_cpu_threads_batch: "CPU batch threads (-tb)",
    btn_generate: "▶ Generate & Start",
    btn_save: "💾 Save config",
    btn_start: "🚀 Start",
    btn_logs: "⇩ Logs",
    btn_infer: "✓ Inference test",
    btn_restart: "⟳ Restart",
    btn_stop: "■ Stop",
    h_service: "Service logs",
    s_running: "Running",
    s_stopped: "Stopped",
    s_failed: "Failed",
    s_unknown: "Unknown",
  },
  ru: {
    search: "Поиск моделей",
    empty_notice: "Нет доступных моделей. Положите .gguf в модельный каталог.",
    no_models: "Модели не найдены",
    badge_config: "config",
    badge_none: "no config",
    l_host: "Адрес привязки",
    l_port: "Порт HTTP-сервера",
    l_api_key: "API-ключ",
    l_wait_timeout: "Ожидание /health, сек",
    l_context_size: "Контекст, токены",
    l_parallel: "Параллельные последовательности",
    l_batch_size: "Batch size",
    l_ubatch_size: "Unpadded batch",
    l_fit_target: "Запас VRAM, MiB",
    l_cache_k: "Кэш ключей",
    l_cache_v: "Кэш значений",
    l_flash_attn: "Flash attention",
    l_numa: "NUMA стратегия",
    l_cpu_threads: "Потоки CPU (-t)",
    l_cpu_threads_batch: "Потоки CPU для батча (-tb)",
    btn_generate: "▶ Generate & Start",
    btn_save: "💾 Save config",
    btn_start: "🚀 Start",
    btn_logs: "⇩ Логи",
    btn_infer: "✓ Inference test",
    btn_restart: "⟳ Restart",
    btn_stop: "■ Stop",
    h_service: "Логи службы",
    s_running: "Running",
    s_stopped: "Stopped",
    s_failed: "Failed",
    s_unknown: "Unknown",
  },
};
const LANGS = ["en", "ru"];
let curLang = "en";

function loadLang() {
  const saved = localStorage.getItem("lang");
  const nav = (navigator.language || "").slice(0, 2).toLowerCase();
  if (saved && LANGS.includes(saved)) curLang = saved;
  else if (nav && LANGS.includes(nav)) curLang = nav;
  else curLang = "en";
}
function setLang(l) {
  if (!LANGS.includes(l)) l = "en";
  curLang = l;
  localStorage.setItem("lang", l);
  renderI18n();
}
function t(k) {
  return (I18N[curLang] && I18N[curLang][k]) || I18N.en[k] || k;
}
function renderI18n() {
  document.documentElement.lang = curLang;
  document.getElementById("lang").value = curLang;
  document.getElementById("search").placeholder = t("search");
  document.getElementById("empty").textContent = t("empty_notice");
  document.getElementById("btn-restart").innerHTML = t("btn_restart");
  document.getElementById("btn-stop").innerHTML = t("btn_stop");
  document.getElementById("btn-generate").innerHTML = t("btn_generate");
  document.getElementById("btn-save").innerHTML = t("btn_save");
  document.getElementById("btn-start").innerHTML = t("btn_start");
  document.getElementById("btn-logs").innerHTML = t("btn_logs");
  document.getElementById("btn-infer").innerHTML = t("btn_infer");
  const h = document.querySelector("main h2");
  if (h) h.textContent = t("h_service");
  if (CURRENT) refreshStatus(); // update state label to current language
}
// -------------------------------------------------------------------------

const PARAMS=[
  ["HOST","l_host"],
  ["PORT","l_port"],
  ["API_KEY","l_api_key"],
  ["LLAMA_WAIT_TIMEOUT","l_wait_timeout"],
  ["CONTEXT_SIZE","l_context_size"],
  ["PARALLEL","l_parallel"],
  ["BATCH_SIZE","l_batch_size"],
  ["UBATCH_SIZE","l_ubatch_size"],
  ["FIT_TARGET_MIB","l_fit_target"],
  ["CACHE_TYPE_K","l_cache_k"],
  ["CACHE_TYPE_V","l_cache_v"],
  ["FLASH_ATTN","l_flash_attn"],
  ["NUMA","l_numa"],
  ["CPU_THREADS","l_cpu_threads"],
  ["CPU_THREADS_BATCH","l_cpu_threads_batch"]
];

async function api(url,opts){const r=await fetch(url,opts);const t=await r.text();try{return JSON.parse(t)}catch(e){return{text:t}}}
async function jget(url){const r=await api(url);return r}
async function jpost(url,body){return api(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})})}

async function refreshStatus(){
  const s=await jget("/api/status");STATUS=s;
  const dot=document.getElementById("dot"),st=document.getElementById("state");
  const sub=document.getElementById("sub");
  const a=(s.ActiveState||"").toLowerCase();
  dot.classList.remove("running","stopped","unknown");
  if(a==="active"){dot.classList.add("running");st.textContent=t("s_running");}
  else if(a==="inactive"){dot.classList.add("stopped");st.textContent=t("s_stopped");}
  else if(a==="failed"){dot.classList.add("stopped");st.textContent=t("s_failed");}
  else{dot.classList.add("unknown");st.textContent=t("s_unknown");}
  sub.textContent=(s.SubState||"")+(s.MainPID?(" pid "+s.MainPID):"");
}

async function loadModels(){
  const m=await jget("/api/models");MODELS=m.models||[];renderModels();
}
function renderModels(){
  const q=(document.getElementById("search").value||"").toLowerCase();
  const box=document.getElementById("models");box.innerHTML="";
  const list=MODELS.filter(x=>x.name.toLowerCase().includes(q));
  if(!list.length){box.innerHTML='<div class="notice" style="padding:14px">'+t("no_models")+'</div>';return;}
  list.forEach(m=>{
    const el=document.createElement("div");
    el.className="model"+(CURRENT&&CURRENT.path===m.path?" active":"");
    el.innerHTML=`<div class="name">${esc(m.name)}</div>
      <div class="meta"><span>${human(m.size)}</span>
      <span class="badge ${m.has_config?"cfg":""}">${m.has_config?t("badge_config"):t("badge_none")}</span></div>`;
    el.onclick=()=>selectModel(m);
    box.appendChild(el);
  });
}
function selectModel(m){
  CURRENT=m;
  document.getElementById("empty").classList.add("hidden");
  document.getElementById("editor").classList.remove("hidden");
  document.getElementById("sel-path").textContent="Model: "+m.path;
  jget("/api/config?model="+encodeURIComponent(m.path)).then(cfg=>buildForm(cfg));
  renderModels();
}
function buildForm(cfg){
  const box=document.getElementById("form");box.innerHTML="";
  PARAMS.forEach(([key,labelKey])=>{
    const v=cfg[key]!==undefined?cfg[key]:"";
    const f=document.createElement("div");f.className="field";
    f.innerHTML=`<label>${t(labelKey)} <code style="color:var(--accent)">${key}</code></label>
      <input data-key="${key}" value="${escAttr(v)}">`;
    box.appendChild(f);
  });
}
async function saveCfg(){
  if(!CURRENT)return;
  const cfg={model:CURRENT.path};
  document.querySelectorAll("#form input").forEach(i=>{
    const v=i.value;
    cfg[i.dataset.key]=/^-?\d+$/.test(v)?parseInt(v,10):v;
  });
  const r=await jpost("/api/config",cfg);
  flash(JSON.stringify(r).slice(0,200));
  loadModels();
}
async function doStart(){
  if(!CURRENT)return;
  await saveCfg();
  const r=await jpost("/api/start?model="+encodeURIComponent(CURRENT.path));
  flash(JSON.stringify(r).slice(0,400));
  refreshStatus();
}
async function doAction(action){
  if(!CURRENT&&action!=="start"){}
  const q=CURRENT?("?model="+encodeURIComponent(CURRENT.path)):"";
  const r=await jpost("/api/"+action+q);
  flash(JSON.stringify(r).slice(0,300));
  refreshStatus();
}
async function refreshLogs(){
  const r=await jget("/api/logs?lines=200");
  document.getElementById("logs").textContent=r.logs||"";
}
async function healthTest(){
  if(!CURRENT)return;
  const r=await jpost("/api/health-test?model="+encodeURIComponent(CURRENT.path));
  flash(JSON.stringify(r).slice(0,500));
}
function flash(msg){document.getElementById("result").textContent=msg;}
function human(n){const u=1024;if(n<u)return n+" B";const e=Math.floor(Math.log(n)/Math.log(u));return (n/Math.pow(u,e)).toFixed(1)+" "+["KB","MB","GB","TB"][e-1];}
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function escAttr(s){return esc(String(s)).replace(/"/g,"&quot;");}

async function init(){
  loadLang();
  renderI18n();
  await refreshStatus();
  await loadModels();
  setInterval(refreshStatus,5000);
  if(CURRENT)setInterval(refreshLogs,5000);
}
init();
</script>
</body>
</html>
