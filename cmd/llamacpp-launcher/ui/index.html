<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>llamacpp-launcher</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>llamacpp-launcher</h1>
  <select class="lang-select" id="lang" onchange="setAppLang(this.value)">
    <option value="en">EN</option>
    <option value="ru">RU</option>
  </select>
  <div class="status"><span class="dot unknown" id="dot"></span>
    <span id="state">…</span>
    <span id="sub" style="color:var(--dim)"></span>
  </div>
  <div style="flex:1"></div>
  <button id="btn-restart" data-i18n="btn_restart" onclick="doAction('restart')">⟳ Restart</button>
  <button id="btn-stop" class="danger" data-i18n="btn_stop" onclick="doAction('stop')">■ Stop</button>
  <button id="btn-settings" class="gear" onclick="toggleSettings(event)" title="">⚙</button>
</header>

<div class="settings-pop hidden" id="settings-pop">
  <div class="card">
    <h2 id="h-settings" data-i18n="settings_menu">Settings</h2>
    <div class="info" id="server-url">http://127.0.0.1:8080</div>

    <div class="settings-section">
      <div class="section-title" data-i18n="l_server_settings">Server settings</div>
      <div class="field"><label id="l_web_host" data-i18n="l_web_host">Web host</label><input id="set-host" value="127.0.0.1"></div>
      <div class="field"><label id="l_web_port" data-i18n="l_web_port">Web port</label><input id="set-port" value="8080"></div>
      <div class="notice" id="settings-hint" data-i18n="settings_hint">Web server host and port</div>
      <div class="row-actions">
        <button id="btn-save-settings" class="primary" data-i18n="btn_save_settings" onclick="saveSettings()">Save &amp; restart</button>
      </div>
    </div>

    <div class="settings-section">
      <div class="section-title" data-i18n="l_app_settings">Application</div>
      <div class="field"><label id="l_model_dir" data-i18n="l_model_dir">Model directory</label><input id="set-model-dir" type="text" autocomplete="off" spellcheck="false"></div>
      <div class="field" style="margin-top:12px"><label id="l_llama_server" data-i18n="l_llama_server">llama-server binary</label><input id="set-llama-server" type="text" autocomplete="off" spellcheck="false"></div>
      <div class="field" style="margin-top:12px"><label id="l_language" data-i18n="l_language">Language</label>
        <select id="set-lang" class="lang-select" onchange="setAppLang(this.value)">
          <option value="en">EN</option>
          <option value="ru">RU</option>
        </select>
      </div>
      <div class="row-actions">
        <button id="btn-save-app" class="primary" data-i18n="btn_apply" onclick="saveAppSettings()">Apply</button>
      </div>
    </div>

    <div class="notice" id="settings-result"></div>
  </div>
</div>

<main>
  <aside class="side">
    <div class="bar"><input id="search" placeholder="Search models" data-i18n-placeholder="search" oninput="renderModels()"></div>
    <div id="models"></div>
  </aside>

  <section class="main">
    <div id="empty" class="notice" data-i18n="empty_notice">No models available. Place a .gguf file in the model directory.</div>
    <div id="editor" class="hidden">
        <div class="info" id="sel-path"></div>
        <div class="preset-row">
          <label id="presets-label" data-i18n="l_presets">Presets</label>
          <select id="presets" class="lang-select" onchange="onPreset()">
            <option value="">—</option>
          </select>
        </div>
        <h2 id="h_flags" data-i18n="h_flags">Flags</h2>
        <div class="grid" id="form"></div>

      <div class="row-actions">
        <button id="btn-generate" class="primary" data-i18n="btn_generate" onclick="doStart()">▶ Generate &amp; Start</button>
        <button id="btn-save" data-i18n="btn_save" onclick="saveCfg()">💾 Save config</button>
        <button id="btn-start" data-i18n="btn_start" onclick="doAction('start')">🚀 Start</button>
        <button id="btn-logs" data-i18n="btn_logs" onclick="refreshLogs()">⇩ Logs</button>
        <button id="btn-infer" data-i18n="btn_infer" onclick="healthTest()">✓ Inference test</button>
      </div>
      <div class="info" id="result"></div>

      <h2 id="h-service-logs" data-i18n="h_service">Service logs</h2>
      <textarea class="logs" id="logs" spellcheck="false"></textarea>
    </section>
  </main>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
